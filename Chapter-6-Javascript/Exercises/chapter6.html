<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petrol Calculator</title>
    <link rel="stylesheet" href="chapter6.css">
</head>
<body>
    <!-- main container -->
    <div class="container">
        <h1>Petrol Calculator</h1>

        <!-- petrol price input -->
        <label for="price">Cost per liter (€):</label>
        <input type="number" id="price" value="1.72" step="0.01">

        <!-- liters input -->
        <label for="liters">Liters purchased:</label>
        <input type="number" id="liters" value="0" step="0.1">

        <!-- calculate button -->
        <button id="calculate">Calculate Total Cost</button>

        <!-- result display -->
        <p id="result">Total Cost: €0.00</p>
    </div>

    <script src="chapter6.js"></script>
</body>
</html>
