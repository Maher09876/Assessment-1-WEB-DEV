<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 5 - Video & Soundboard</title>
    <link rel="stylesheet" href="chapter5.css">
</head>
<body>

<!-- video section -->
<section class="video-section">
    <h1>Looping Video</h1>
    <video class="center-video" width="640" height="360" controls loop poster="https://peach.blender.org/wp-content/uploads/title_anouncement.jpg?x11217">
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
        your browser does not support the video tag
    </video>
</section>

<!-- soundboard section -->
<section class="soundboard-section">
    <h1>Soundboard</h1>
    <div class="soundboard">
        <button class="sound-btn" data-audio="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">Sample 1</button>
        <button class="sound-btn" data-audio="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">Sample 2</button>
        <button class="sound-btn" data-audio="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">Sample 3</button>
        <button class="sound-btn" data-audio="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3">Sample 4</button>
        <button class="sound-btn" data-audio="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3">Sample 5</button>
    </div>
</section>

<script src="chapter5.js"></script>
</body>
</html>
